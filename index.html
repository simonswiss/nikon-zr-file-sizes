<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikon ZR Storage Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Nikon ZR Storage Calculator</h1>
            <p class="subtitle">See how much recording time you get with different settings</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="storage">Storage Size</label>
                <select id="storage">
                    <option value="64">64 GB</option>
                    <option value="128">128 GB</option>
                    <option value="256">256 GB</option>
                    <option value="512" selected>512 GB</option>
                    <option value="1024">1 TB</option>
                    <option value="2048">2 TB</option>
                </select>
            </div>

            <div class="control-group">
                <label for="codec">Codec</label>
                <select id="codec">
                    <option value="r3d-ne">R3D NE (12-bit RAW)</option>
                    <option value="n-raw">N-RAW (12-bit)</option>
                    <option value="prores-raw-hq">ProRes RAW HQ</option>
                    <option value="prores-422-hq">ProRes 422 HQ</option>
                    <option value="h265-10bit">H.265 10-bit</option>
                    <option value="h265-8bit">H.265 8-bit</option>
                    <option value="h264">H.264</option>
                </select>
            </div>

            <div class="control-group">
                <label for="resolution">Resolution / Frame Rate</label>
                <select id="resolution"></select>
            </div>
        </div>

        <div class="result-card">
            <div class="result-main">
                <span class="result-value" id="result-time">--</span>
                <span class="result-label">recording time</span>
            </div>
            <div class="result-details">
                <div class="detail">
                    <span class="detail-label">Data Rate</span>
                    <span class="detail-value" id="result-datarate">--</span>
                </div>
                <div class="detail">
                    <span class="detail-label">Per Minute</span>
                    <span class="detail-value" id="result-perminute">--</span>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-header">
                <span class="chart-title">Compare Recording Times</span>
                <div class="chart-toggle">
                    <button id="btn-by-mode" class="active">By Mode</button>
                    <button id="btn-by-codec">By Codec</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="comparisonChart"></canvas>
            </div>
        </div>

        <footer>
            <p>Data rates are estimates. Actual times vary by scene complexity.</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
